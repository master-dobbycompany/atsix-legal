<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본인확인 · 여섯시</title>
<!-- 포트원 V2 브라우저 SDK. 본인확인 창(KG이니시스 통합본인인증)을 연다. -->
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<style>
  :root { --bg: #FFFAF9; --ink: #3B3236; --muted: #7A6E73; }
  body { margin: 0; padding: 48px 20px; background: var(--bg); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         text-align: center; line-height: 1.6; }
  p { margin: 0 auto; max-width: 360px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<p id="msg">본인확인 창을 여는 중이에요…</p>
<p class="sub" id="sub">여섯시 앱 안에서 열린 페이지예요.</p>
<script type="module">
// 앱(웹뷰)이 ?store=&channel=&id= 로 연다. 끝나면 같은 주소에 ?done=1 을 붙여 돌아오고,
// 앱은 그 주소를 가로채 결과를 받는다(페이지를 실제로 그리지 않는다).
// 모바일에서는 SDK 가 본인확인 페이지로 넘어갔다가 redirectUrl 로 돌아오며
// identityVerificationId · code · message 를 붙인다. PC 처럼 돌아오지 않고 끝나는 환경은 아래에서 직접 넘긴다.
const q = new URLSearchParams(location.search);
const base = location.origin + location.pathname;
const msg = document.getElementById('msg');
const sub = document.getElementById('sub');

function finish(params) {
  location.replace(base + '?' + new URLSearchParams({ done: '1', ...params }).toString());
}

async function start() {
  if (q.get('done') === '1') {
    msg.textContent = '본인확인을 마쳤어요. 앱으로 돌아가는 중이에요…';
    sub.textContent = '';
    return;
  }
  const storeId = q.get('store') || '';
  const channelKey = q.get('channel') || '';
  const id = q.get('id') || '';
  if (!storeId || !channelKey || !/^atsix-[0-9a-f-]{36}-[a-z0-9]{8,32}$/.test(id)) {
    msg.textContent = '잘못된 요청이에요. 앱에서 다시 시도해 주세요.';
    return;
  }
  try {
    const res = await PortOne.requestIdentityVerification({
      storeId,
      identityVerificationId: id,
      channelKey,
      redirectUrl: base + '?done=1',
    });
    const out = { identityVerificationId: id };
    if (res && res.code) {
      out.code = res.code;
      if (res.message) out.message = res.message;
    }
    finish(out);
  } catch (e) {
    finish({ identityVerificationId: id, code: 'CLIENT_ERROR', message: String((e && e.message) || e) });
  }
}

start();
</script>
</body>
</html>

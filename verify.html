<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본인확인 · 여섯시</title>
<!-- 포트원 V2 브라우저 SDK. 본인확인 창(KG이니시스 통합본인인증)을 연다. -->
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<style>
  :root { --bg: #FFFAF9; --ink: #3B3236; --muted: #7A6E73; }
  body { margin: 0; padding: 48px 20px; background: var(--bg); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         text-align: center; line-height: 1.6; }
  p { margin: 0 auto; max-width: 360px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<p id="msg">본인확인 창을 여는 중이에요…</p>
<p class="sub" id="sub">여섯시 앱 안에서 열린 페이지예요.</p>
<script type="module">
// 앱(웹뷰)이 ?id= 로 연다. store·channel 은 주소에서 받지 않는다 —
// 공식 도메인에서 남의 포트원 상점으로 창을 띄우는 길을 막는다(2026-11-21).
// 값은 app_config(공개 전제)에서 읽는다. 끝나면 ?done=1 로 돌아오고 앱이 가로챈다.
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';

const q = new URLSearchParams(location.search);
const base = location.origin + location.pathname;
const msg = document.getElementById('msg');
const sub = document.getElementById('sub');

function finish(params) {
  location.replace(base + '?' + new URLSearchParams({ done: '1', ...params }).toString());
}

async function loadPortoneConfig() {
  const sb = createClient(
    'https://snszyugzoxektvcyydya.supabase.co',
    'sb_publishable_3a09zQjtuhXN8CV0g7NnaQ_kGTtqlNC',
    { auth: { persistSession: false, autoRefreshToken: false } },
  );
  const { data, error } = await sb
    .from('app_config')
    .select('key, value')
    .in('key', ['portone_store_id', 'portone_identity_channel_key']);
  if (error) throw error;
  const map = Object.fromEntries((data ?? []).map((r) => [r.key, r.value]));
  const read = (k) => {
    const v = map[k];
    if (v == null) return '';
    return typeof v === 'string' ? v : String(v).replace(/^"|"$/g, '');
  };
  return { storeId: read('portone_store_id'), channelKey: read('portone_identity_channel_key') };
}

async function start() {
  if (q.get('done') === '1') {
    msg.textContent = '본인확인을 마쳤어요. 앱으로 돌아가는 중이에요…';
    sub.textContent = '';
    return;
  }
  const id = q.get('id') || '';
  if (!/^atsix-[0-9a-f-]{36}-[a-z0-9]{8,32}$/.test(id)) {
    msg.textContent = '잘못된 요청이에요. 앱에서 다시 시도해 주세요.';
    return;
  }
  let storeId = '';
  let channelKey = '';
  try {
    const cfg = await loadPortoneConfig();
    storeId = cfg.storeId;
    channelKey = cfg.channelKey;
  } catch (e) {
    console.warn(e);
    msg.textContent = '인증 연결을 준비하고 있어요. 잠시 뒤 앱에서 다시 시도해 주세요.';
    return;
  }
  if (!storeId || !channelKey) {
    msg.textContent = '인증 연결을 준비하고 있어요. 잠시 뒤 앱에서 다시 시도해 주세요.';
    return;
  }
  try {
    const res = await PortOne.requestIdentityVerification({
      storeId,
      identityVerificationId: id,
      channelKey,
      redirectUrl: base + '?done=1',
      // KG이니시스 통합인증은 flgFixedUser 가 없으면 창을 열지 않는다. 고객 정보를 미리 넘기지 않는다(N).
      // FRGNDInfo N: 네이버·카카오에서 검증되지 않는 성별·외국인 입력 칸을 띄우지 않는다(쓰지 않는 값).
      bypass: {
        inicisUnified: {
          flgFixedUser: 'N',
          FRGNDInfo: 'N',
          logoUrl: location.origin + location.pathname.replace(/verify\.html$/, '') + 'assets/inicis_logo.png',
        },
      },
    });
    const out = { identityVerificationId: id };
    if (res && res.code) {
      out.code = res.code;
      if (res.message) out.message = res.message;
    }
    finish(out);
  } catch (e) {
    finish({ identityVerificationId: id, code: 'CLIENT_ERROR', message: String((e && e.message) || e) });
  }
}

start();
</script>
</body>
</html>

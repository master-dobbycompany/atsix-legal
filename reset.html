<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>여섯시 — 비밀번호 재설정</title>
<link rel="stylesheet" href="assets/legal.css">
<style>
  input { width:100%; padding:12px; border:1px solid #E5DFD8; border-radius:12px;
          font:inherit; margin-top:8px; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:#F2543D;
           color:#fff; font:inherit; font-weight:700; margin-top:14px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .msg { margin-top:14px; padding:12px; border-radius:12px; font-size:14px; }
  .ok { background:#E0F3EC; color:#0E8C6D; }
  .err { background:#FBE9E9; color:#C0392B; }
</style>
</head>
<body>
<main>
  <h1>비밀번호 재설정</h1>
  <p>가입한 이메일로 재설정 링크를 보내드려요. 링크를 <b>이 기기에서</b> 열면 새 비밀번호를 정할 수 있어요.</p>

  <!-- ① 메일 요청 (이 페이지에서 보내야 한다 — 아래 주석 참고) -->
  <div id="ask">
    <input id="email" type="email" placeholder="가입한 이메일" autocomplete="username">
    <button id="send">재설정 메일 받기</button>
  </div>

  <!-- ② 메일 링크로 돌아왔을 때 -->
  <div id="form" style="display:none">
    <input id="pw" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password">
    <button id="go">변경하기</button>
  </div>

  <div id="msg"></div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// anon 키는 공개 전제다. 이 페이지가 할 수 있는 일은 메일 링크로 받은 세션의
// 비밀번호를 바꾸는 것뿐이고, 그 세션은 Supabase 가 발급·검증한다.
// **메일 링크로 들어왔는지**를 클라이언트가 URL 을 지우기 전에 잡아 둔다.
// 폼은 이때만 보여준다. supabase-js 는 세션을 localStorage 에 남기므로, 한 번 재설정한
// 브라우저는 다음에 그냥 들어와도 세션이 살아 있다 — 세션만 보고 폼을 띄우면 그 기기를
// 집어 든 누구든 메일 없이 비밀번호를 바꿀 수 있었다(2026-09-13 실기기에서 발견).
const params = new URLSearchParams(location.search);
const fromLink = params.has('code');
const linkError = params.has('error') || location.hash.includes('error');

const sb = createClient(
  'https://snszyugzoxektvcyydya.supabase.co',
  'sb_publishable_3a09zQjtuhXN8CV0g7NnaQ_kGTtqlNC',
  { auth: { detectSessionInUrl: true, flowType: 'pkce' } }
);

const $ = (id) => document.getElementById(id);
function say(text, cls) {
  $('msg').className = 'msg ' + cls;
  $('msg').textContent = text;
}

// ⚠ 재설정 메일은 **이 페이지에서** 보낸다. 앱에서 보내면 안 된다 —
// supabase_flutter 는 기본이 PKCE 라 code_verifier 가 앱 저장소에 저장되는데,
// 메일 링크는 브라우저로 열린다. 브라우저에는 verifier 가 없어 ?code= 교환이 실패한다.
// 요청과 교환이 같은 브라우저에서 일어나야 흐름이 닫힌다.
async function sendMail() {
  const email = $('email').value.trim();
  if (!email.includes('@')) return say('이메일을 확인해주세요.', 'err');
  $('send').disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname,
  });
  $('send').disabled = false;
  // 계정이 있든 없든 같은 문구를 보여준다 — 응답이 갈리면 가입 여부가 새어 나간다.
  if (error) console.warn(error);
  say('메일을 보냈어요. 메일의 링크를 이 기기에서 열어주세요.', 'ok');
}

// detectSessionInUrl 이 ?code= 를 자동으로 교환한다. 잠깐 걸리므로 이벤트도 함께 듣는다.
function showNewPasswordForm() {
  $('ask').style.display = 'none';
  $('form').style.display = 'block';
  say('새 비밀번호를 정해주세요.', 'ok');
}

const { data: { session } } = await sb.auth.getSession();
if (fromLink && session) {
  showNewPasswordForm();
} else {
  // 링크 없이 들어왔는데 지난번 세션이 남아 있으면 이 브라우저에서만 지운다.
  if (session) await sb.auth.signOut({ scope: 'local' });
  if (linkError) {
    say('링크가 만료됐거나 올바르지 않아요. 아래에서 다시 요청해주세요.', 'err');
  } else if (fromLink) {
    // 교환 실패 — 대개 메일을 요청한 브라우저와 링크를 연 브라우저가 다를 때다.
    say('링크를 열지 못했어요. 메일을 요청한 브라우저에서 링크를 열거나, 아래에서 다시 요청해주세요.', 'err');
  }
}

$('send').onclick = sendMail;
$('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMail(); });

$('go').onclick = async () => {
  const pw = $('pw').value, pw2 = $('pw2').value;
  if (pw.length < 6) return say('비밀번호는 6자 이상이어야 해요.', 'err');
  if (pw !== pw2) return say('두 비밀번호가 서로 달라요.', 'err');

  $('go').disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw });
  $('go').disabled = false;
  if (error) return say('바꾸지 못했어요: ' + error.message, 'err');

  $('form').style.display = 'none';
  // 바꾼 뒤에는 세션을 남기지 않는다 — 남기면 다음 방문자가 또 바꿀 수 있다.
  await sb.auth.signOut({ scope: 'local' });
  say('비밀번호를 바꿨어요. 앱으로 돌아가 새 비밀번호로 로그인해주세요.', 'ok');
};
</script>
</body>
</html>
